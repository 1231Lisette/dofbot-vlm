<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOFBOT · 真机控制台</title>
  <link rel="stylesheet" href="/web/hardware-control.css">
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">DOFBOT / HARDWARE CONSOLE</p><h1>真机手势控制台</h1></div>
      <div class="header-actions">
        <span id="server-state" class="chip">连接中</span>
        <button id="emergency-stop" class="danger">急停 / 解除扭矩</button>
      </div>
    </header>

    <section class="top-grid">
      <div class="panel camera-panel">
        <div class="panel-title"><div><span>01</span><h2>Jetson 摄像头</h2></div><b id="camera-state">WAITING</b></div>
        <div class="camera-frame mirrored" id="camera-frame">
          <img id="camera-image" alt="Jetson camera">
          <canvas id="overlay" width="640" height="480"></canvas>
          <div id="camera-placeholder" class="placeholder">等待 `/dev/video0` 图像…</div>
        </div>
        <label class="mirror"><input id="mirror" type="checkbox" checked> 镜像预览</label>
      </div>

      <aside class="panel gesture-panel">
        <div class="panel-title"><div><span>02</span><h2>手势识别</h2></div><b id="model-state">LOADING</b></div>
        <div class="live-result">
          <span id="gesture-icon">—</span>
          <div><strong id="gesture-name">等待手势</strong><small id="gesture-action">尚未触发</small></div>
          <b id="confidence">0%</b>
        </div>
        <div class="progress"><i id="gesture-progress"></i></div>
        <p id="message">点赞、握拳和 V 手势需连续稳定出现，放下手后才能再次触发。</p>
        <div class="gesture-list">
          <article data-gesture="Thumb_Up"><span>👍</span><div><strong>点赞</strong><small>张开夹爪</small></div></article>
          <article data-gesture="Closed_Fist"><span>✊</span><div><strong>握拳</strong><small>闭合夹爪</small></div></article>
          <article data-gesture="Victory"><span>✌️</span><div><strong>V 手势</strong><small>上举并点头两次 · 待标定</small></div></article>
        </div>
        <label class="hardware-unlock"><input id="hardware-unlock" type="checkbox"> 我已清空工作区、托住机械臂并握住断电开关</label>
      </aside>
    </section>

    <section class="panel servo-panel">
      <div class="panel-title">
        <div><span>03</span><h2>六轴单舵机控制</h2></div>
        <div class="torque-actions"><button id="resume" disabled>恢复扭矩</button><b id="hardware-state">硬件锁定</b></div>
      </div>
      <p class="section-note">每次只发送一个舵机目标。未完成标定的舵机会由服务端拒绝，而不是仅靠网页禁用。</p>
      <div id="servo-controls" class="servo-controls"></div>
    </section>
  </main>
  <script type="module" src="/web/hardware-control.js"></script>
</body>
</html>
