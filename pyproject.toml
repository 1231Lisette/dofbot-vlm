[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dofbot-vlm"
version = "0.6.11"
description = "Cross-platform Web + FastAPI + MuJoCo starter for a Dofbot course project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "mujoco>=3.2,<4",
  "numpy>=1.26,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools]
packages = ["backend", "backend.app", "robot", "simulation", "perception", "planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
